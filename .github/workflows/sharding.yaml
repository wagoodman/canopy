name: "Sharding self-test"

# exercises `canopy test --shard` and `canopy shard join` end to end on the fixture tree in
# internal/test-fixtures/sharding. Receipts are passed between jobs as artifacts (not the cache), so the
# result doesn't depend on cache state or branch. Everything runs with --no-cache: cached packages record
# no timings, which would starve the metrics pass.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_COLOR: true
  FIXTURE: ./internal/test-fixtures/sharding/...

jobs:

  build:
    name: "Build canopy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          tools: "false"

      - name: Build
        run: go build -o bin/canopy ./cmd/canopy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canopy-bin
          path: bin/canopy
          if-no-files-found: error

  shard:
    name: "Shard ${{ matrix.shard }}/${{ strategy.job-total }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          tools: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          mkdir -p .canopy/shard/out
          canopy test "$FIXTURE" --no-cache --cover --shard "$SHARD/$TOTAL" \
            -o go -o json=".canopy/shard/out/shard-$SHARD.jsonl"

      - name: Assert on receipt (test-count plan)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          r=".canopy/shard/out/shard-$SHARD.json"
          jq -e --argjson i "$SHARD" '.index == $i and .total == 3 and .passed == true' "$r"
          jq -e '.inputs.weights.source != "metrics"' "$r"
          # the shard that owns wide (heaviest by test count) owns nothing else
          jq -e '(.planned | any(endswith("/wide")) | not) or (.planned | length == 1)' "$r"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receipts-${{ matrix.shard }}
          path: .canopy/shard/out/
          include-hidden-files: true
          if-no-files-found: error

  rogue:
    # stands in for "a flag set on one job by mistake": shard 2 with a -run filter nobody else has
    name: "Rogue shard 2/3"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          tools: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run rogue shard
        env:
          # the env var is the realistic way this happens (the receipt records test-flag -run=...)
          CANOPY_TEST_RUN: TestDoesNotExist
        run: |
          set -euo pipefail
          mkdir -p .canopy/shard/out
          canopy test "$FIXTURE" --no-cache --cover --shard 2/3 -o go

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receipts-rogue
          path: .canopy/shard/out/
          include-hidden-files: true
          if-no-files-found: error

  join:
    name: "Join"
    needs: [shard, rogue]
    runs-on: ubuntu-latest
    steps:
      # no checkout and no Go toolchain: the join only needs receipts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: receipts-[123]
          merge-multiple: true
          path: .canopy/shard/out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: receipts-rogue
          path: rogue

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Positive case
        run: |
          set -euo pipefail

          expect_exit() {
            local want=$1; shift
            set +e
            "$@" 2>&1 | tee text.out
            local got=${PIPESTATUS[0]}
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want, got $got: $*" >&2
              exit 1
            fi
          }

          expect_exit 0 canopy shard join -o text -o json=report.json -o github-summary=summary.md
          jq -e '.exit_code == 0 and .result == "pass" and .problems == [] and .checks.verified.ok' report.json
          grep -E '^PASS' text.out

          # github-summary file has the shard table
          test -s summary.md
          grep -F '1/3' summary.md

          # test-count plan: wide is alone on its shard
          jq -e '[.shards[] | select(.planned | any(endswith("/wide")))] | length == 1 and (.[0].planned | length == 1)' report.json
          jq -e '[.shards[].weights.source] | all(. != "metrics")' report.json

          # the merged metrics get written (uploaded below for the metrics pass)
          jq -e '.checks.metrics.written' report.json
          test -s .canopy/shard/metrics.json

      - name: Combined event log
        run: |
          set -euo pipefail

          # concatenated shard event streams render (and store) as one run
          cat .canopy/shard/out/*.jsonl | canopy format --store --store-dir .canopy/combined --session selftest
          canopy list runs --store-dir .canopy/combined -o json | tee runs.json
          jq -e 'length == 1 and .[0].session_name == "selftest"' runs.json

          # every package the shards planned shows up in the combined stream
          jq -r '.shards[].planned[]' report.json | sort -u > planned.txt
          jq -r 'select(.Package != null) | .Package' .canopy/shard/out/*.jsonl | sort -u > seen.txt
          diff planned.txt seen.txt
          jq -e '.packages == ($n | tonumber)' --arg n "$(wc -l < planned.txt)" report.json

      - name: Negative cases
        run: |
          set -euo pipefail

          expect_exit() {
            local want=$1; shift
            set +e
            "$@" 2>&1 | tee text.out
            local got=${PIPESTATUS[0]}
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want, got $got: $*" >&2
              exit 1
            fi
          }

          # every case gets its own copy of the receipts, so cases can't affect each other
          mkcase() {
            mkdir -p "cases/$1"
            cp -r .canopy/shard/out "cases/$1/out"
          }

          echo "::group::missing shard"
          mkcase missing
          rm cases/missing/out/shard-2.*
          expect_exit 3 canopy shard join --shard-dir cases/missing -o text -o json=report.json
          jq -e '.exit_code == 3 and (.problems | map(.kind) == ["missing_shard"]) and .problems[0].shards == [2] and .shards[1].present == false' report.json
          grep -E 'missing receipt for shard 2/3' text.out
          echo "::endgroup::"

          echo "::group::rogue shard"
          mkcase rogue
          cp rogue/shard-2.* cases/rogue/out/
          expect_exit 3 canopy shard join --shard-dir cases/rogue -o text -o json=report.json
          jq -e '.exit_code == 3 and any(.problems[]; .kind == "input_mismatch" and .group == "run" and .differing == [2] and .only_in["2"] == ["test-flag -run=TestDoesNotExist"])' report.json
          grep -F 'test-flag -run=TestDoesNotExist' text.out
          echo "::endgroup::"

          echo "::group::covermin flag"
          mkcase covermin-flag
          expect_exit 4 canopy shard join --shard-dir cases/covermin-flag --covermin 100 -o text -o json=report.json
          jq -e '.exit_code == 4 and any(.problems[]; .kind == "coverage_below") and .checks.coverage.threshold_source == "join"' report.json
          grep -E '^FAIL +coverage' text.out
          echo "::endgroup::"

          echo "::group::covermin from .canopy.yaml"
          mkcase covermin-config
          mkdir cfg
          printf 'test:\n  covermin: 100\n' > cfg/.canopy.yaml
          (
            cd cfg
            expect_exit 4 canopy shard join --shard-dir ../cases/covermin-config -o text -o json=report.json
            jq -e '.exit_code == 4 and any(.problems[]; .kind == "coverage_below") and .checks.coverage.threshold_source == "join"' report.json
            grep -E '^FAIL +coverage' text.out
          )
          echo "::endgroup::"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: .canopy/shard/metrics.json
          include-hidden-files: true
          if-no-files-found: error

  shard-with-metrics:
    name: "Shard ${{ matrix.shard }}/${{ strategy.job-total }} (metrics)"
    needs: [build, join]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          tools: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metrics
          path: .canopy/shard

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      # same command as the first pass, so the [run] inputs (and the metrics profile) match
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          mkdir -p .canopy/shard/out
          canopy test "$FIXTURE" --no-cache --cover --shard "$SHARD/$TOTAL" \
            -o go -o json=".canopy/shard/out/shard-$SHARD.jsonl"
          jq -e '.inputs.weights.source == "metrics"' ".canopy/shard/out/shard-$SHARD.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receipts-metrics-${{ matrix.shard }}
          path: .canopy/shard/out/
          include-hidden-files: true
          if-no-files-found: error

  join-with-metrics:
    name: "Join (metrics)"
    needs: shard-with-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: receipts-metrics-*
          merge-multiple: true
          path: .canopy/shard/out

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Join and assert the plan changed
        run: |
          set -euo pipefail
          canopy shard join -o text -o json=report.json
          jq -e '.exit_code == 0 and .problems == []' report.json
          jq -e '[.shards[].weights.source] | all(. == "metrics")' report.json

          # measured times changed the plan: slow (5s) is alone on its shard, and wide no longer is
          jq -e '[.shards[] | select(.planned | any(endswith("/slow")))] | length == 1 and (.[0].planned | length == 1)' report.json
          jq -e '[.shards[] | select(.planned | any(endswith("/wide")))] | length == 1 and (.[0].planned | length > 1)' report.json

  failing-tests:
    name: "Failing tests"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          tools: "false"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canopy-bin
          path: bin

      - name: Install canopy
        run: |
          chmod +x bin/canopy
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Plan puts wide alone
        run: |
          set -euo pipefail
          canopy shard plan "$FIXTURE" --shards 3 -o json > plan.json
          jq -e '.plans[0].total == 3 and .weights.source == "static"' plan.json
          jq -e '[.plans[0].shards[] | select(.packages | any(.package | endswith("/wide")))] | length == 1 and (.[0].packages | length == 1)' plan.json

      - name: Run both shards, then join
        run: |
          set -euo pipefail

          # -tags shardfail adds a failing test to tagged/, so exactly one shard fails (its receipt is still written)
          failed=0
          for i in 1 2; do
            canopy test "$FIXTURE" --no-cache --cover --tags shardfail --shard "$i/2" -o go || failed=$((failed + 1))
          done
          test "$failed" -eq 1

          set +e
          canopy shard join -o text -o json=report.json 2>&1 | tee text.out
          got=${PIPESTATUS[0]}
          set -e
          test "$got" -eq 1

          jq -e '.exit_code == 1 and any(.problems[]; .kind == "shard_failed")' report.json
          jq -e '[.shards[].failures[] | select((.package | endswith("/tagged")) and (.test | contains("TestShardFail")))] | length == 1' report.json
          grep -E '^FAIL +tests' text.out
